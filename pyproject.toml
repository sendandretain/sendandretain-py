[project]
name = "sendandretain"
version = "0.1.0"
description = "Python SDK for the Send & Retain API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Send & Retain" }]
keywords = ["email", "transactional-email", "lifecycle", "automations", "sendandretain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.23.1,<0.29.0",
    "attrs>=22.2.0",
]

[project.urls]
Homepage = "https://sendandretain.com"
Documentation = "https://sendandretain.com/docs"
Source = "https://github.com/sendandretain/sendandretain-py"
Issues = "https://github.com/sendandretain/sendandretain-py/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sendandretain"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "openapi.json", "README.md", "LICENSE"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.14",
    "mypy>=1.13",
    "openapi-python-client==0.29.0",
]

# Matches what openapi-python-client itself formats the generated tree with, so
# `ruff format --check` is stable across a regeneration.
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Generated code is the generator's business, not ours — we only keep it
# import-clean. Editing it by hand is what verify_schema_sync.py exists to catch.
"src/sendandretain/api/**" = ["E", "B", "UP"]
"src/sendandretain/models/**" = ["E", "B", "UP"]
"src/sendandretain/client.py" = ["E", "B", "UP"]
"src/sendandretain/types.py" = ["E", "B", "UP"]
"src/sendandretain/errors.py" = ["E", "B", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "scripts"]
strict = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
# The generated tree is checked by the generator's own templates; type-checking
# it here produces noise we cannot action without hand-editing generated files.
module = ["sendandretain.api.*", "sendandretain.models.*", "sendandretain.client", "sendandretain.types", "sendandretain.errors"]
ignore_errors = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
